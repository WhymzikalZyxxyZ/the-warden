name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore TheWarden.sln

      - name: Build
        run: dotnet build TheWarden.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test TheWarden.Core (with coverage)
        run: >
          dotnet test tests/TheWarden.Core.Tests/TheWarden.Core.Tests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

  publish-release:
    name: Publish release artifacts
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Deliberately no -o override: combining a custom output path with
      # EnableMsixTooling+PublishSingleFile trips an MSBuild duplicate-file-copy
      # bug (MSB3094) in the current Windows App SDK targets. The SDK's default
      # publish path is used instead and referenced directly in later steps.
      - name: Publish portable win-x64 executable
        run: >
          dotnet publish src/TheWarden.App/TheWarden.App.csproj
          -r win-x64 -c Release --self-contained true

      - name: Locate publish output
        id: publish-dir
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path src/TheWarden.App/bin/Release -Recurse -Directory -Filter publish | Select-Object -First 1
          "dir=$($dir.FullName)" >> $env:GITHUB_OUTPUT

      # Signing requires a self-signed Authenticode certificate stored as a
      # base64-encoded GitHub secret (SIGNING_CERT_BASE64 / SIGNING_CERT_PASSWORD).
      # See docs/adr/0003-distribution-and-code-signing.md. This step is a no-op
      # (with a warning) until those secrets are configured — release artifacts
      # are still produced unsigned rather than failing the release.
      - name: Sign executable (if certificate configured)
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            Write-Warning "SIGNING_CERT_BASE64 not set — publishing unsigned per ADR-0003 until a certificate is configured."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "warden-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          & signtool sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ steps.publish-dir.outputs.dir }}\TheWarden.App.exe"
          Remove-Item $certPath

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path "${{ steps.publish-dir.outputs.dir }}\*" -DestinationPath TheWarden-portable-win-x64.zip

      # Lets anyone verify the download wasn't altered in transit — no cert or
      # secret needed, just a hash next to the file, same as most open-source
      # releases publish.
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path TheWarden-portable-win-x64.zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  TheWarden-portable-win-x64.zip" | Out-File -Encoding ascii TheWarden-portable-win-x64.zip.sha256

      # Free alternative/complement to a purchased Authenticode certificate:
      # cryptographically ties this exact release artifact to this exact repo,
      # workflow, and commit via Sigstore, verifiable with `gh attestation verify`.
      # Doesn't stop SmartScreen from warning on first run (that needs a trusted
      # cert), but does give anyone a way to confirm the binary genuinely came
      # from this build pipeline rather than somewhere else.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            TheWarden-portable-win-x64.zip
            TheWarden-portable-win-x64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TheWarden-portable-win-x64.zip
            TheWarden-portable-win-x64.zip.sha256
          generate_release_notes: true
